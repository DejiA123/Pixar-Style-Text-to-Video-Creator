<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TakeOne">
  <!-- TakeOne: a film clapperboard marked "1" (take one), in the app's blue-violet-pink gradient -->
  <defs>
    <linearGradient id="to-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="0.5" stop-color="#a98bff"/>
      <stop offset="1" stop-color="#ff8ad8"/>
    </linearGradient>
    <clipPath id="to-stick"><rect x="12" y="13" width="41" height="9" rx="2.5"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#to-g)"/>
  <!-- the clapper stick, swung open -->
  <g transform="rotate(-13 13 22)">
    <rect x="12" y="13" width="41" height="9" rx="2.5" fill="#0b0c0f"/>
    <g clip-path="url(#to-stick)" fill="#ffffff">
      <path d="M16 13h6l-5 9h-6z M28 13h6l-5 9h-6z M40 13h6l-5 9h-6z M52 13h6l-5 9h-6z"/>
    </g>
  </g>
  <!-- the slate with the take number -->
  <rect x="12" y="25" width="41" height="27" rx="4.5" fill="#0b0c0f"/>
  <path d="M28.5 33.5l5-3.2h3.4v17h-4.6V36.4l-3.8 2.3z" fill="#ffffff"/>
</svg>
